# Wayfarer — single-command self-hosting
# `docker compose up` takes a fresh clone from zero to a running instance.
# Copy .env.example → .env, fill in API keys, then `docker compose up`.

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_ENDPOINT=http://ollama:11434
      - REDIS_URL=redis://redis:6379
    depends_on:
      - qdrant
      - ollama
      - redis
    volumes:
      - ./data/uploads:/app/data/uploads
      # Named volume so the SQLite tracker DB (data/wayfarer.db under /app/data)
      # survives container recreation. The deeper bind mount above still wins for
      # uploads while this persists the application-tracker state.
      - wayfarer_data:/app/data
      - ./config:/app/config:ro

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  qdrant_data:
  ollama_data:
  wayfarer_data:
