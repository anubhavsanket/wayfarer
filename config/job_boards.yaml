# Wayfarer — Job Board Registry
# Every job source is defined as an entry here, not as bespoke code.
# Adding a new board = adding an entry here, not writing new fetch/parse code.

job_boards:
  # ── Remote-first sources with JD descriptions ───────────────────────

  - name: remoteok
    enabled: true
    type: rest_api
    base_url: "https://remoteok.com/api"
    auth: none
    rate_limit_per_min: 30
    default_remote_type: "remote"
    field_mapping:
      id: "$.id"
      title: "$.position"
      company: "$.company"
      location: "$.location"
      url: "$.url"
      description: "$.description"
      remote_type: "$.remote"
    pagination:
      type: "none"
      param: ""
      max_pages: 1

  - name: remotive
    enabled: true
    type: rest_api
    base_url: "https://remotive.com/api/remote-jobs"
    auth: none
    rate_limit_per_min: 30
    default_remote_type: "remote"
    field_mapping:
      id: "$.id"
      title: "$.title"
      company: "$.company_name"
      location: "$.candidate_required_location"
      url: "$.url"
      description: "$.description"
      remote_type: "$.job_type"
    pagination:
      type: "none"
      param: ""
      max_pages: 1

  - name: jobicy
    enabled: true
    type: rest_api
    base_url: "https://jobicy.com/api/v2/remote-jobs"
    auth: none
    rate_limit_per_min: 30
    default_remote_type: "remote"
    field_mapping:
      id: "$.id"
      title: "$.jobTitle"
      company: "$.companyName"
      location: "$.jobGeo"
      url: "$.url"
      description: "$.jobDescription"
      remote_type: "$.jobType"
    pagination:
      type: "query_param"
      param: "count"
      max_pages: 1

  - name: arbeitnow
    enabled: true
    type: rest_api
    base_url: "https://www.arbeitnow.com/api/job-board-api"
    auth: none
    rate_limit_per_min: 30
    field_mapping:
      id: "$.id"
      title: "$.title"
      company: "$.company_name"
      location: "$.location"
      url: "$.url"
      description: "$.description"
      remote_type: "$.remote"
    pagination:
      type: "query_param"
      param: "page"
      max_pages: 3

  - name: himalayas
    enabled: true
    type: rest_api
    base_url: "https://himalayas.app/jobs/api"
    auth: none
    rate_limit_per_min: 30
    default_remote_type: "remote"
    field_mapping:
      id: "$.id"
      title: "$.title"
      company: "$.company"
      location: "$.location"
      url: "$.url"
      description: "$.description"
      remote_type: "$.remote"
    pagination:
      type: "query_param"
      param: "offset"
      max_pages: 2

  # ── India / API-key sources ────────────────────────────────────────

  - name: adzuna
    enabled: false  # Enable when ADZUNA_API_KEY is set
    type: rest_api
    base_url: "https://api.adzuna.com/v1/api/jobs/in/search/1"
    auth: api_key
    api_key_env: "ADZUNA_API_KEY"
    rate_limit_per_min: 25
    extra_params:
      results_per_page: "20"
      what: "ai machine learning"
    field_mapping:
      id: "$.id"
      title: "$.title"
      company: "$.company.display_name"
      location: "$.location.display_name"
      url: "$.redirect_url"
      description: "$.description"
    pagination:
      type: "query_param"
      param: "page"
      max_pages: 3

  - name: bluedoor
    enabled: true
    type: rest_api
    base_url: "https://api.bluedoor.sh/job-postings/v1/jobs/search"
    auth: api_key
    api_key_env: "BLUEDOOR_API_KEY"
    rate_limit_per_min: 100
    field_mapping:
      id: "$.job_id"
      title: "$.title"
      company: "$.org_name"
      location: "$.city"
      remote_type: "$.remote_policy"
      url: "$.apply_url"
      description: "$.description"
    pagination:
      type: "none"
      param: ""
      max_pages: 1

  - name: linkedin_guest
    enabled: true
    type: rest_api
    base_url: "https://www.linkedin.com/jobs-guest/jobs/api/seeMoreJobPostings/search"
    auth: none
    rate_limit_per_min: 20
    extra_headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
      Accept: "text/html"
    field_mapping:
      title: "$.title"
      company: "$.org_name"
      location: "$.city"
      url: "$.apply_url"
    pagination:
      type: "start_offset"
      param: "start"

  # ── Board-specific sources (target-list based) ────────────────────
  # These require knowing the company's board identifier.
  # Add your target companies below — each is a config change, not code.

  - name: greenhouse
    enabled: false  # Enable with GREENHOUSE_BOARD_TOKENS env var (comma-separated)
    type: rest_api
    base_url: "https://boards-api.greenhouse.io/v1/boards/{board_token}/jobs"
    auth: none
    rate_limit_per_min: 30
    field_mapping:
      id: "$.id"
      title: "$.title"
      company: "$.location.name"
      location: "$.location.name"
      url: "$.absolute_url"
      description: "$.content"
    pagination:
      type: "none"
      param: ""
      max_pages: 1
    # Note: requires GREENHOUSE_BOARD_TOKENS env var with comma-separated board tokens
    # Example: GREENHOUSE_BOARD_TOKENS=anthropic,openai,google

  - name: lever
    enabled: false  # Enable with LEVER_POSTING_URLS env var (comma-separated)
    type: rest_api
    base_url: "https://api.lever.co/v0/postings/{company}"
    auth: none
    rate_limit_per_min: 30
    field_mapping:
      id: "$.id"
      title: "$.text"
      company: "$.categories.team"
      location: "$.categories.location"
      url: "$.hostedUrl"
      description: "$.descriptionPlain"
    pagination:
      type: "none"
      param: ""
      max_pages: 1
    # Note: requires LEVER_POSTING_URLS env var with comma-separated company slugs
    # Example: LEVER_POSTING_URLS=anthropic,stripe,airbnb

  - name: workday
    enabled: false  # Enable with WORKDAY_URLS env var (comma-separated)
    type: rest_api
    base_url: "https://www.workday.com/wday/cxs/{company}/{site}/jobs"
    auth: none
    rate_limit_per_min: 20
    extra_params:
      limit: "20"
      offset: "0"
    field_mapping:
      id: "$.bulletFields[0]"
      title: "$.title"
      company: "$.locationsText"
      location: "$.locationsText"
      url: "$.externalPath"
      description: "$.jobDescriptionInfo.jobDescription"
    pagination:
      type: "offset"
      param: "offset"
      step: 20
      max_pages: 3
    # Note: requires WORKDAY_URLS env var with comma-separated company/site paths
    # Example: WORKDAY_URLS=anthropic/jobs,google/jobs

  - name: ashby
    enabled: false  # Enable with ASHBY_ORG env var
    type: rest_api
    base_url: "https://jobs.ashbyhq.com/api/non-user-graphql?op=ApiJobBoardWithTeams"
    auth: none
    rate_limit_per_min: 20
    extra_params:
      operationName: "ApiJobBoardWithTeams"
    field_mapping:
      id: "$.id"
      title: "$.title"
      company: "$.teamName"
      location: "$.locationName"
      url: "$.id"
    pagination:
      type: "none"
      param: ""
      max_pages: 1
    # Note: requires ASHBY_ORG env var with company slug
    # Also requires custom query handling (GraphQL) — marked as experimental