# Wayfarer — Job Board Registry
# Every job source is defined as an entry here, not as bespoke code.
# Adding a new board = adding an entry here, not writing new fetch/parse code.

job_boards:
  # ── Sources with JD descriptions (better matching) ──────────────────

  - name: remoteok
    enabled: true
    type: rest_api
    base_url: "https://remoteok.com/api"
    auth: none
    rate_limit_per_min: 30
    default_remote_type: "remote"  # All Remote OK jobs are remote
    field_mapping:
      id: "$.id"
      title: "$.position"
      company: "$.company"
      location: "$.location"
      url: "$.url"
      description: "$.description"
      remote_type: "$.remote"
    pagination:
      type: "none"
      param: ""
      max_pages: 1

  - name: remotive
    enabled: true
    type: rest_api
    base_url: "https://remotive.com/api/remote-jobs"
    auth: none
    rate_limit_per_min: 30
    default_remote_type: "remote"  # All Remotive jobs are remote
    field_mapping:
      id: "$.id"
      title: "$.title"
      company: "$.company_name"
      location: "$.candidate_required_location"
      url: "$.url"
      description: "$.description"
      remote_type: "$.job_type"
    pagination:
      type: "none"
      param: ""
      max_pages: 1

  # ── Sources without JD descriptions (title/location only) ───────────

  - name: bluedoor
    enabled: true
    type: rest_api
    base_url: "https://api.bluedoor.sh/job-postings/v1/jobs/search"
    auth: api_key
    api_key_env: "BLUEDOOR_API_KEY"
    rate_limit_per_min: 100
    field_mapping:
      id: "$.job_id"
      title: "$.title"
      company: "$.org_name"
      location: "$.city"
      remote_type: "$.remote_policy"
      url: "$.apply_url"
      description: "$.description"
    pagination:
      type: "none"
      param: ""
      max_pages: 1

  - name: linkedin_guest
    enabled: true
    type: rest_api
    base_url: "https://www.linkedin.com/jobs-guest/jobs/api/seeMoreJobPostings/search"
    auth: none
    rate_limit_per_min: 20
    extra_headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
      Accept: "text/html"
    field_mapping:
      title: "$.title"
      company: "$.org_name"
      location: "$.city"
      url: "$.apply_url"
    pagination:
      type: "start_offset"
      param: "start"