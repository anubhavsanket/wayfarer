# Wayfarer — Main configuration settings
# Load from .env file overrides — same keys, snake_case in YAML, UPPER_CASE in env

# LLM Router Configuration
llm:
  provider: "nvidia"  # nvidia | openrouter | ollama
  rate_limits:
    nvidia:
      requests: 10
      window: 60  # seconds
    openrouter:
      requests: 30
      window: 60
    ollama:
      requests: 60
      window: 60

  models:
    simple:  # for keyword extraction, tier classification
      nvidia: "gpt-4o-mini"
      openrouter: "meta-llama/llama-3.1-8b-instruct"
      ollama: "llama3.2:3b"
    complex:  # for bullet rewriting, synthesis, matching
      nvidia: "gpt-4o"
      openrouter: "anthropic/claude-3-5-sonnet"
      ollama: "llama3.2:70b"

  nvidia_nim:
    endpoint: "https://integrate.api.nvidia.com/v1"
    api_key_env: "NVIDIA_NIM_API_KEY"

  openrouter:
    endpoint: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"

# Embedding Model (shared across all stages)
embedding:
  model: "nomic-embed-text"
  endpoint: "http://ollama:11434/api/embeddings"

# ChromaDB Configuration
chromadb:
  host: "chromadb"
  port: 8001
  persist_dir: "./chroma_db"

collections:
  search_cache:
    name: "search_cache"
    metadata: { "description": "Crawl4AI fetched pages for web search caching" }
  resume_sections:
    name: "resume_sections"
    metadata: { "description": "Parsed resume sections for ATS checking" }
  job_postings:
    name: "job_postings"
    metadata: { "description": "Job descriptions for matching pipeline" }

# Search API Configuration (Stage 1)
search:
  max_sources: 5
  top_k: 5
  timeout: 30
  tavily:
    api_key_env: "TAVILY_API_KEY"
  brave:
    api_key_env: "BRAVE_API_KEY"

# ATS Resume Checker Configuration (Stage 2)
resume:
  parser:
    pdfplumber: true
    python_docx: true
  ats_simulation:
    enabled: true  # extract text as naive ATS would
  confidence:
    verified_threshold: 0.9  # keyword present near-verbatim
    reworded_threshold: 0.7  # partial semantic match
    max_suggestions_per_keyword: 3

# Job Matcher Configuration (Stage 3)
jobs:
  max_postings: 100
  match:
    top_k: 20
    semantic_weight: 0.7
    keyword_weight: 0.3
  location:
    default_city: "Bengaluru"
    supported_modes:
      - specific_city
      - remote_only
      - hybrid
      - open_to_relocation
  legitimacy:
    min_description_length: 100
    max_gibberish_ratio: 0.3  # % of placeholder/suspicious words
    company_blacklist: []  # external API for known scam companies

# System Performance
performance:
  max_vram_gb: 4
  cache:
    content_hash_dir: "./cache/content_hashes"
    max_entries: 10000
    ttl_hours: 48
  concurrent_fetches: 3

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./logs/wayfarer.log"

# Environment overrides (example .env content)
# LLM_PROVIDER=openrouter
# NVIDIA_NIM_API_KEY=your_nvidia_key
# OPENROUTER_API_KEY=your_openrouter_key
# TAVILY_API_KEY=your_tavily_key
# BRAVE_API_KEY=your_brave_key
# CHROMA_HOST=chromadb
# CHROMA_PORT=8001
# OLLAMA_ENDPOINT=http://ollama:11434